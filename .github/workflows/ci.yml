name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Preflight Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      # Preflight wraps lint, format, pyright, surface-count, client drift, SKILL
      # sync, config-docs sync, version consistency, and the typer-group
      # smoke test in one shot. ``--skip tests`` lets the matrix job below
      # own pytest so we don't pay for it twice in CI.
      - name: Preflight (lint + types + drift + config + version + smoke)
        run: uv run --locked python scripts/preflight.py --skip tests

  unit-tests:
    name: Unit Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the whole matrix when one OS/Python combo fails — we want
      # to see which platform broke, not just the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
        exclude:
          # macOS runners are the slowest/most expensive; 3.14 there is
          # redundant once Linux + Windows already cover the newest Python.
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - name: Run unit tests
        run: uv run --locked pytest tests/unit/ -v --tb=short

  browser-smoke:
    name: Browser Smoke / Playwright + CloakBrowser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Install Chromium headless shell and system libraries
        run: uv run --locked playwright install --with-deps --only-shell chromium
      # The shared fixture also launches CloakBrowser, which downloads its
      # binary on first use. Use local pages so navigation needs no website.
      - name: Install recording encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Navigate, screenshot, and evaluate on both backends
        run: >-
          uv run --locked pytest tests/integration/test_navigation.py
          -k "navigate_local_page or screenshot_default_jpeg or evaluate_js"
          -v --tb=short --timeout=60
      - name: Browser controls, workspace isolation, and CLI recovery
        run: >-
          uv run --locked pytest
          tests/integration/test_page_emulation.py
          tests/integration/test_storage_lifecycle.py
          tests/integration/test_visual_evidence.py
          tests/integration/test_network_lifecycle.py
          tests/integration/test_evaluate_context.py
          tests/integration/test_interaction_observation.py
          tests/integration/test_input_actions.py
          tests/integration/test_network_controls.py
          tests/integration/test_snapshot_errors.py
          tests/integration/test_hide_init_document.py
          tests/integration/test_workspace_sessions.py
          tests/integration/test_workspace_cli.py
          tests/integration/test_recovery_evidence.py
          tests/integration/test_bridge_runtime.py
          -v --tb=short --timeout=100

      - name: Headed pointer emulation and reset
        run: >-
          xvfb-run -a env AGENTCLOAK_TEST_HEADED=1 uv run --locked pytest
          tests/integration/test_page_emulation.py
          -k session_environment -v --tb=short --timeout=60

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify install from wheel
        run: pip install dist/*.whl && agentcloak --help

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Export locked dependencies (including all extras)
        run: uv export --locked --all-extras --no-emit-project --no-hashes --output-file /tmp/agentcloak-audit.txt
      - name: Audit locked dependencies
        run: uvx pip-audit --strict --no-deps --disable-pip --requirement /tmp/agentcloak-audit.txt
      - run: pip install pip-audit
      - run: pip install -e .
      - name: Audit fresh installation
        run: pip-audit
