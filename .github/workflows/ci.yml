name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Preflight Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      # ``ruff format --check`` isn't wrapped by preflight (style-only,
      # rarely fires) so we keep it as a discrete step for fast feedback.
      - name: Ruff format
        run: uv run ruff format --check src/ tests/
      # Preflight wraps lint, pyright, surface-count, client drift, SKILL
      # sync, config-docs sync, version consistency, and the typer-group
      # smoke test in one shot. ``--skip tests`` lets the matrix job below
      # own pytest so we don't pay for it twice in CI.
      - name: Preflight (lint + types + drift + config + version + smoke)
        run: uv run python scripts/preflight.py --skip tests

  unit-tests:
    name: Unit Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the whole matrix when one OS/Python combo fails — we want
      # to see which platform broke, not just the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
        exclude:
          # macOS runners are the slowest/most expensive; 3.14 there is
          # redundant once Linux + Windows already cover the newest Python.
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify install from wheel
        run: pip install dist/*.whl && agentcloak --help

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit
      - run: pip install -e .
      - name: Audit dependencies
        run: pip-audit
