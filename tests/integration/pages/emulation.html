<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Page environment fixture</title>
<style>
  html { background: rgb(255, 255, 255); }
  @media (prefers-color-scheme: dark) { html { background: rgb(16, 16, 16); } }
</style>
<script>
  window.initialEnvironment = {
    dark: matchMedia('(prefers-color-scheme: dark)').matches,
    reduce: matchMedia('(prefers-reduced-motion: reduce)').matches
  };
</script>
</html>
